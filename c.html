<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Don't Wake the Boss · Challenge</title>
<meta property="og:title" content="You've been challenged in Don't Wake the Boss">
<meta property="og:description" content="Sneak past the sleeping boss faster than your friend. Race their ghost.">
<meta property="og:image" content="https://mngebaly.github.io/dont-wake-the-boss-site/icon.png">
<style>body{font:16px/1.5 -apple-system,system-ui,sans-serif;max-width:560px;margin:0 auto;padding:36px 20px;text-align:center;color:#2a2420;background:#fff6e3}
img{width:110px;height:110px;border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.2)}h1{font-size:28px;line-height:1.2;margin:18px 0 6px}
a.btn,button{display:block;width:100%;box-sizing:border-box;margin:12px 0;padding:15px;border-radius:14px;border:0;font:700 17px system-ui;text-decoration:none;cursor:pointer}
.p{background:#ff8a3d;color:#fff}.s{background:#eadcbd;color:#2a2420}code{display:block;word-break:break-all;background:#f3e6c8;border-radius:10px;padding:10px;font-size:11px;text-align:left;margin-top:8px}
@media (prefers-color-scheme:dark){body{background:#141d1c;color:#fff6e3}.s{background:#2f3e3c;color:#fff6e3}code{background:#22302e}}</style></head><body>
<img src="icon.png" alt="Don't Wake the Boss app icon">
<h1 id="h">You've been challenged!</h1>
<p id="d">Sneak past the sleeping boss faster than your friend.</p>
<a class="btn p" id="open" href="#">Open in the game</a>
<a class="btn s" href="https://apps.apple.com/app/id6834394460">Get the game on the App Store</a>
<button class="s" id="copy">Copy the code</button>
<p style="font-size:13px;opacity:.75">No app yet? Install it, then tap <b>More → Enter code</b> and paste the code.</p>
<code id="code"></code>
<p style="margin-top:28px;font-size:13px"><a href="./">Support</a> · <a href="privacy.html">Privacy</a></p>
<script>
var code = decodeURIComponent(location.hash.slice(1));
document.getElementById('code').textContent = code || 'No code in this link.';
document.getElementById('open').href = 'dwtb://c/' + encodeURIComponent(code);
if (/^DWTBR-/.test(code)) { document.getElementById('h').textContent = 'A Prank Room for you!'; document.getElementById('d').textContent = 'A friend built a room to trap you. Escape it if you can.'; }
else { try { var j = JSON.parse(atob(code.slice(6).replace(/-/g,'+').replace(/_/g,'/'))); document.getElementById('d').textContent = (j.n || 'Your friend') + ' escaped in ' + (j.t/10).toFixed(1) + 's. Race their ghost and beat it.'; } catch (e) {} }
document.getElementById('copy').onclick = function () { navigator.clipboard.writeText(code).then(function () { document.getElementById('copy').textContent = 'Copied!'; }); };
</script></body></html>
